<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">ER — Estácio Renan</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1419"/>
      <stop offset="1" stop-color="#0f2a22"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#6ee7b7" stop-opacity=".08"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="ink" x1="12" y1="16" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset=".55" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#9bceac" stroke-opacity=".07" stroke-width=".6"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="url(#grid)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#border)" stroke-width="1.5"/>

  <g filter="url(#glow)" fill="none" stroke="url(#ink)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- E -->
    <path d="M26 18H14v28h12"/>
    <path d="M14 32h7"/>
    <!-- R -->
    <path d="M31 46V18h8a7 7 0 0 1 0 14h-8"/>
    <path d="M38 32l7.5 14"/>
  </g>

  <!-- nó de circuito no braço do E -->
  <circle cx="24.5" cy="32" r="2.4" fill="#0b1419" stroke="#5eead4" stroke-width="1.6"/>

  <!-- cursor de terminal -->
  <rect x="49" y="43" width="7" height="3" rx="1" fill="#38bdf8">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
